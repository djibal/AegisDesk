[package]
name = "aegisdesk"
version = "0.1.0"
description = "AegisDesk secure desktop app framework"
edition = "2021"
rust-version = "1.77"

[lib]
name = "aegisdesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
uuid = { version = "1", features = ["v4"] }
unicode-normalization = "0.1"
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
thiserror = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[features]
# macOS 14+ only: enables per-app proxy (used for Offline / proxied mode).
macos-proxy = ["tauri/macos-proxy"]
